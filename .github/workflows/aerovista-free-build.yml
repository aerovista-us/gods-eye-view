name: AeroVista Free Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aerovista-free-build
  cancel-in-progress: true

jobs:
  build:
    name: Build browser bundle (no cloud deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Build static browser assets
        run: npm run build
      - name: Publish build artifact for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aerovista-gods-eye-browser-build
          path: dist/
          if-no-files-found: error
          retention-days: 1
